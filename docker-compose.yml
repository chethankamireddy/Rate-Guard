version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rateguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: rateguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rateguard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rate-limiter-engine:
    build:
      context: ./rate-limiter
      dockerfile: Dockerfile
    container_name: rateguard-engine-cpp
    restart: unless-stopped
    ports:
      - "7070:7070"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rateguard-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rate-limiter-engine:
        condition: service_started
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/rateguard?schema=public
      REDIS_URL: redis://redis:6379
      CPP_ENGINE_URL: http://rate-limiter-engine:7070
      RATE_LIMITER_MODE: AUTO
      DEFAULT_ALGORITHM: TOKEN_BUCKET
      DEFAULT_LIMIT: 100
      DEFAULT_WINDOW_DURATION: 60
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rateguard-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "3000:80"

volumes:
  postgres_data:
  redis_data:
